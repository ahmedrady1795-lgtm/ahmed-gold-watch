name: Spot Ignition Check
on:
  push:
    branches: [render-free]
    paths:
      - 'lib/spot-ignition.ts'
      - 'lib/spot-aggressive.ts'
      - 'lib/spot-accumulation.ts'
      - 'lib/binance-cooldown.ts'
      - 'tests/binance-cooldown.cjs'
      - 'tests/spot-accumulation.cjs'
      - 'Dockerfile'
      - 'tests/spot-aggressive.cjs'
      - 'lib/spot-radar.ts'
      - 'lib/client-spot-radar.ts'
      - 'app/api/spot-radar/route.ts'
      - 'app/spot/page.tsx'
      - 'app/spot/spot.css'
      - 'tests/spot-ignition.cjs'
      - 'tests/spot-radar.cjs'
      - '.github/workflows/spot-ignition.yml'
  workflow_dispatch:
jobs:
  spot-ignition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify Binance IP-ban cooldown
        run: node tests/binance-cooldown.cjs
      - name: Verify three-window buying acceleration
        run: node tests/spot-accumulation.cjs
      - name: Check early-buying fast lane
        run: node tests/spot-aggressive.cjs
      - name: Verify two-snapshot real-buy-flow conditions
        run: node tests/spot-ignition.cjs
      - name: Regression test existing Spot radar
        run: node tests/spot-radar.cjs
      - name: Check TypeScript integration
        run: npx tsc --noEmit
