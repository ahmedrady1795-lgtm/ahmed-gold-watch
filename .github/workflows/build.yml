name: Build Check

on:
  push:
    branches: [main, railway, render-free]
  pull_request:
    branches: [railway, render-free]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --experimental-strip-types tests/gold-liquidity-radar.mjs
      - run: node tests/web-source-resilience.cjs
      - run: node tests/scalp-learning.cjs
      - run: node tests/ai-readiness.cjs
      - run: node --check learning-worker.mjs
      - run: node tests/railway-eco.cjs
      - run: node tests/neural-optout.cjs
      - run: node tests/indicators.cjs
      - run: node tests/home-news-singleton.cjs
      - run: node tests/sniper-ui-dedup.cjs
      - run: node tests/sniper-command-layout.cjs
      - run: node tests/professional-move.cjs
      - run: node tests/ai-model-certification.cjs
      - run: node tests/execution-readiness.cjs
      - run: node tests/mt5-bridge-safety.cjs
      - run: python3 -m py_compile mt5_bridge/bridge.py
      - run: python3 tests/mt5-book-subscription.py
      - run: node tests/core-quality.cjs
      - run: node tests/scalp.cjs
      - run: node tests/news-alert-window.cjs
      - run: node tests/news-intelligence.cjs
      - run: node tests/scalp-presentation.cjs
      - run: node tests/next-move-view.cjs
      - run: node tests/sniper-outlook.cjs
      - run: node tests/continuous-direction.cjs
      - run: node tests/sniper-stability.cjs
      - run: node tests/four-hour-structure.cjs
      - run: node tests/liquidity-foundation.cjs
      - run: node tests/optional-market-evidence.cjs
      - run: node tests/gold-feed-order.cjs
      - run: node tests/btc-history-nonblocking.cjs
      - run: node tests/ai-stall-recovery.cjs
      - run: node tests/pre-move-pressure.cjs
      - run: node tests/forecast-evidence-gate.cjs
      - run: node tests/trend-confirmation.cjs
      - run: node tests/sniper-strategies.cjs
      - run: node tests/sniper-decision-guide.cjs
      - run: node tests/chart-zone-merge.cjs
      - run: node tests/long-range-targets.cjs
      - run: node tests/sniper-watch.cjs
      - run: node tests/sniper-archive.mjs
      - run: node tests/sniper-archive-status.cjs
      - run: node tests/sniper-scorecard.cjs
      - run: node tests/forecast-motion.cjs
      - run: node tests/forecast-motion-causal.cjs
      - run: node tests/forecast-illustration.cjs
      - run: node tests/visual-forecast-candles.cjs
      - run: node tests/conditional-target-candles.cjs
      - run: node tests/btc-chart-source-guard.cjs
      - run: node tests/chart-price-viewport.cjs
      - run: node tests/scalp-forward-reach.cjs
      - run: node tests/sniper-scorecard.cjs
      - run: node tests/forecast-journal.cjs
      - run: node tests/direction.cjs
      - run: node tests/movement.cjs
      - run: python3 -m compileall -q ml-service neural-service
      - run: node tests/order-flow-radar.mjs
      - run: node tests/sniper-radar-next-candle.cjs
      - run: node tests/sniper-m15-watch-prices.cjs
      - run: node tests/gold-radar-inline.cjs
      - run: node tests/sniper-m15-scenario.cjs
      - run: node tests/sniper-m15-target-bridge.cjs
      - run: node tests/sniper-m15-mt5-viewport.cjs
      - run: node tests/sniper-m15-classic-layout.cjs
      - run: node tests/sniper-m15-walkforward.cjs
      - run: node tests/sniper-m15-stability.cjs
      - run: node tests/sniper-m15-visual-alignment.cjs
      - run: node tests/sniper-m15-reactions.cjs
      - run: npm run build
