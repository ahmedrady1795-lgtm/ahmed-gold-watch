name: Build Check

on:
  push:
    branches: [render-free]
  pull_request:
    branches: [render-free]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node tests/flow-profile-decision.cjs
      - run: node tests/gold-source-continuity.cjs
      - run: npm run build
      - run: node tests/gold-preparation-lead.mjs
      - run: node tests/chart-feed-isolation.cjs
      - run: node tests/chart-refresh.cjs
      - run: node tests/sniper-risk-plan.cjs && node tests/next-move-cooldown.cjs && node tests/btc-provider-continuity.cjs && node tests/ai-service-warmup.cjs
      - run: node --experimental-strip-types tests/gold-liquidity-radar.mjs
      - run: node tests/web-source-resilience.cjs
      - run: node tests/scalp-learning.cjs
      - run: node tests/ai-transport-regression.cjs
      - run: node tests/neural-request-budget.cjs
      - run: node tests/render-free-eco.cjs
      - run: node --experimental-strip-types tests/render-free-viewer-lease.mjs
      - run: node tests/ai-readiness.cjs
      - run: node tests/sniper-health.cjs
      - run: node --check learning-worker.mjs
      - run: node tests/railway-eco.cjs
      - run: node tests/neural-optout.cjs
      - run: node tests/indicators.cjs
      - run: node tests/home-news-singleton.cjs
      - run: node tests/sniper-ui-dedup.cjs
      - run: node tests/sniper-command-layout.cjs
      - run: node tests/professional-move.cjs
      - run: node tests/ai-model-certification.cjs
      - run: node tests/execution-readiness.cjs
      - run: node tests/mt5-bridge-safety.cjs
      - run: python3 -m py_compile mt5_bridge/bridge.py
      - run: python3 tests/mt5-book-subscription.py
      - run: python3 tests/mt5-limit-only.py
      - run: python3 tests/mt5-pending-guard.py
      - run: node --experimental-strip-types tests/mt5-btc-readonly.mjs
      - run: node --experimental-strip-types tests/mt5-btc-demo-plan.mjs
      - run: node --experimental-strip-types tests/mt5-btc-demo-market-plan.mjs
