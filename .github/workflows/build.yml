  microstructure-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'numpy>=2,<3' 'scikit-learn>=1.6,<2' 'requests>=2.32,<3' 'joblib>=1.4,<2'
      - run: python tests/ml-history-cooldown.py
      - run: python tests/microstructure-training.py
