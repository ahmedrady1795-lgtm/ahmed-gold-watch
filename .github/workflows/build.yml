name: Build Check

on:
  push:
    branches: [main, railway]
  pull_request:
    branches: [railway]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --check learning-worker.mjs
      - run: node tests/scalp.cjs
      - run: node tests/movement.cjs
      - run: python3 -m compileall -q ml-service neural-service
      - run: npm run build
