name: Unpack Ahmed Gold Command

on:
  push:
    paths:
      - "source/ahmed-gold-command.tar.xz"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack application bundle
        run: |
          rm -rf /tmp/ahmed-gold-command
          mkdir -p /tmp/ahmed-gold-command
          tar -xJf source/ahmed-gold-command.tar.xz -C /tmp/ahmed-gold-command
          rsync -a --delete             --exclude '.git/'             --exclude '.github/'             --exclude 'source/'             /tmp/ahmed-gold-command/ ./

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "Sync Ahmed Gold Command source"
            git push
          fi
