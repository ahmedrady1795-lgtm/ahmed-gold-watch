name: Emergency Railway Image

on:
  push:
    branches:
      - emergency-image-build-20261005
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t ttl.sh/ahmed-gold-watch-8926ced-20261005:24h .
      - name: Push image
        run: docker push ttl.sh/ahmed-gold-watch-8926ced-20261005:24h
