name: Checkpoint frozen BTC/GOLD M1 research
on:
  schedule:
    - cron: '23,53 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qannas-m1-research-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'ahmedrady1795-lgtm/ahmed-gold-watch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: render-free
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Store forward-only paper M1 outcomes without faking fills
        run: node scripts/checkpoint-scalp-research.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
