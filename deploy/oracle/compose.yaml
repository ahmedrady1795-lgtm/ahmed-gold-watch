name: gold-watch

# OCI Ampere Always Free starter: web + ML + paper worker.
# Neural training stays opt-in (profile "neural") until independently qualified.
services:
  ml:
    build:
      context: ../../ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MODEL_DIR: /data
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      ML_RETRAIN_SECONDS: ${ML_RETRAIN_SECONDS:-21600}
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/opt/gold-watch-data}/ml
        target: /data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).close()"]
      interval: 30s
      timeout: 6s
      retries: 8
      start_period: 90s
    mem_limit: 2g
    cpus: 1.5

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      ML_ENGINE_URL: http://ml:8000
      NEURAL_ENGINE_URL: ${NEURAL_ENGINE_URL:-}
      MT5_AUTOTRADE_ENABLED: "false"
      KILL_SWITCH_ENABLED: "true"
      MT5_BRIDGE_TOKEN: ${MT5_BRIDGE_TOKEN:-}
      TRADING_ECONOMICS_API_KEY: ${TRADING_ECONOMICS_API_KEY:-}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      TELEGRAM_ALERTS_ENABLED: ${TELEGRAM_ALERTS_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/opt/gold-watch-data}/web
        target: /data
    depends_on:
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 120s
    mem_limit: 2g
    cpus: 1

  worker:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /srv
    command: ["node", "learning-worker.mjs"]
    volumes:
      - type: bind
        source: ../../learning-worker.mjs
        target: /srv/learning-worker.mjs
        read_only: true
    environment:
      AI_ANALYSIS_URL: http://web:3000/api/ai-analysis
      SCALP_PULSE_URL: http://web:3000/api/scalp
      LEARNING_INTERVAL_MS: ${LEARNING_INTERVAL_MS:-10000}
      SCALP_PULSE_INTERVAL_MS: ${SCALP_PULSE_INTERVAL_MS:-5000}
      SCALP_PULSE_ENABLED: ${SCALP_PULSE_ENABLED:-1}
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    mem_limit: 192m
    cpus: 0.25

  neural:
    profiles: ["neural"]
    build:
      context: ../../neural-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MODEL_DIR: /data
      NEURAL_TORCH_THREADS: "1"
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/opt/gold-watch-data}/neural
        target: /data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).close()"]
      interval: 30s
      timeout: 6s
      retries: 8
      start_period: 90s
    mem_limit: 1800m
    cpus: 1

  caddy:
    profiles: ["public"]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 256m

volumes:
  caddy_data:
  caddy_config:
